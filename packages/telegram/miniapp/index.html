<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relay — trade this window</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="bar" id="browser-bar" hidden>
        <span>Open in Telegram for the full experience — haptics, your theme, and one-tap return.</span>
      </div>

      <header class="head">
        <div class="title">Relay</div>
        <div class="sub" id="who">testnet · Somnia Shannon</div>
      </header>

      <!--
        The whole integration, again: one div. `data-surface="telegram"` is the only
        thing that differs from a website's embed, and it is what makes this flow
        countable separately from the web.
      -->
      <div
        id="mount"
        data-relay-market
        data-surface="telegram"
        data-asset="BTC"
        data-interval="900"
      ></div>

      <footer class="foot">
        <span id="note">Testnet only. The wallet is created in this browser and its key never leaves your device.</span>
      </footer>
    </div>

    <script src="/relay.iife.js"></script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
