# Relay on Render's free tier.
#
# One web service running one process: the API, the chain indexer and the Telegram
# bot, sharing a database pool. Splitting them would need three containers and three
# sets of connections, and the free tier gives one of each.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# The secrets below (sync: false) are filled in by hand at that point; Render never
# reads them from this file.

services:
  - type: web
    name: relay-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    # pnpm is not on the default image; corepack ships with Node 20 and installs the
    # exact version this repo's lockfile was written with.
    # --ignore-scripts: pnpm blocks dependency install scripts by default and FAILS the
    # install unless each is approved, which killed the first build here. Nothing in this
    # tree needs one — esbuild resolves its platform binary through optional
    # dependencies, and ws's native accelerators are optional by design — so skipping
    # them also means a deploy never compiles C++ on a 512 MB box.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm -r build
    startCommand: node packages/server/dist/index.js
    # Render polls this. It answers as soon as the port is bound, and reports indexer
    # lag in its body — an instance that is still backfilling is healthy and says so,
    # rather than being killed and restarted into another backfill.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # A 512 MB instance. Node's default heap target assumes far more, and the
      # backfill's decoded-log batches are the peak.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400

      # ── secrets: set these in the Render dashboard, they are never in git ──
      - key: DATABASE_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MINIAPP_URL
        sync: false
      # Guards PATCH /v1/partners/:id, which corrects a public partner name. Absent
      # by default and the route refuses everything without it — a rename endpoint
      # that falls open is worse than no rename endpoint.
      - key: ADMIN_TOKEN
        sync: false

      # ── chain ──
      - key: RPC_URL
        value: https://dream-rpc.somnia.network
      - key: WS_RPC_URL
        value: wss://dream-rpc.somnia.network/ws
      - key: NETWORK
        value: testnet
      - key: CHAIN_ID
        value: "50312"
      - key: VENUE_ID
        value: "0x679795a0195a1b76cdebb7c51d74e058aee92919b8c3389af86ef24535e8a28c"
      - key: DEFAULT_VENUE_ID
        value: "0x679795a0195a1b76cdebb7c51d74e058aee92919b8c3389af86ef24535e8a28c"

      # ── sized for 512 MB and a free Postgres ──
      # Backfill fetches chunks concurrently; each in-flight chunk is a batch of
      # decoded logs held in memory, so this is the main memory dial.
      - key: INDEXER_CONCURRENCY
        value: "4"
      # One process holds both the API's queries and the indexer's writes. Neon's free
      # tier also caps connections; a pool that opens more than it may fails under load.
      - key: PG_POOL_MAX
        value: "5"
      - key: BACKFILL_HOURS
        value: "24"

      # ── retention ──
      #
      # Measured on this venue, per day, including indexes:
      #   orders      873 500 rows x 635 B = 529 MB      ← the whole problem
      #   raw_events   35 377 rows x 1127 B =  38 MB
      #   fills        14 128 rows x 737 B  =  10 MB     ← kept: this is the product
      #   markets         838 rows x 1241 B =   1 MB     ← kept
      #   redemptions  10 443 rows x 716 B  =   7 MB     ← read by nothing
      #   protocol fees 9 910 rows x 609 B  =   6 MB     ← read by nothing
      #
      # Orders are only needed to attribute a fill whose order arrived in an earlier
      # chunk; the books come from RPC and quoted-but-untaken is latched onto two
      # booleans per market. Three hours is generous for that and costs 66 MB instead
      # of 1.6 GB. With these settings the database settles at roughly 106 MB of
      # rolling data plus ~11 MB/day of permanent history — about 430 MB after a
      # month, inside Neon's 512 MB free tier for five to six weeks.
      #
      # That figure only ever described the TAIL. The backfill used to ignore
      # retention completely: pruning lived in the tail loop, which does not start
      # until the backfill finishes, so a 24-hour catch-up wrote every order in the
      # window — ~800k rows, ~500 MB — and filled the database before it got there.
      # Two changes fixed it, both in packages/indexer/src/ingest: the backfill prunes
      # between segments, and an order older than ORDER_RETENTION_DAYS is not written
      # at all rather than written and deleted minutes later. A 24-hour backfill now
      # lands ~3 hours of orders, not 24.
      - key: ORDER_RETENTION_DAYS
        value: "0.125"
      - key: RAW_EVENT_RETENTION_DAYS
        value: "0.25"
      - key: ARCHIVE_RETENTION_DAYS
        value: "2"
      - key: OTHER_VENUE_RETENTION_DAYS
        value: "1"

      # Where relay.iife.js is served from. Every snippet this API hands a partner
      # carries it, and a partner pastes that snippet once onto a site nobody here
      # will ever look at again — so an unset value is not a cosmetic problem, it is
      # a script tag that fails to resolve on someone else's page. The server refuses
      # to start in production without it. Must match the console's VITE_CDN_URL.
      - key: CDN_URL
        sync: false
      # This service's own public origin. It goes into every snippet as data-api,
      # because the widget's built-in default is http://localhost:8787 — right for
      # local development, dead on a publisher's page.
      - key: PUBLIC_API_URL
        sync: false

      # ── API ──
      - key: API_RATE_LIMIT_PER_MIN
        value: "120"
      - key: GAS_DRIP_PER_HOUR
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_REQUESTS
        value: "false"
