packages:
  - "packages/*"
  - "apps/*"

# markets-sdk declares react as a peer; this repo has no React yet.
autoInstallPeers: false
strictPeerDependencies: false

# pnpm blocks dependency install scripts by default and fails the whole install unless
# each one is listed here. All three are safe and none is optional in practice:
#
#   esbuild                    — places its platform binary. The bundler for
#                                packages/server and two test suites need it.
#   bufferutil, utf-8-validate — optional native accelerators for ws. They compile on
#                                install; if compilation fails they are simply absent
#                                and ws uses its JavaScript path, so a deploy is never
#                                blocked by them.
#
# scripts/smoke-prod.mjs runs this exact install in a fresh clone on every push, which
# is how we know the list is complete.
onlyBuiltDependencies:
  - bufferutil
  - esbuild
  - utf-8-validate
# pnpm writes this block itself the first time it meets an unapproved build script,
# with "set this to true or false" as the value, and then FAILS every install until a
# real boolean replaces it — ERR_PNPM_IGNORED_BUILDS, even under --ignore-scripts,
# because it wants the decision recorded rather than the script run. The placeholder
# got committed, so every CI install was going to fail on it as soon as the pnpm
# version question was answered.
#
# `true` is the decision, and --ignore-scripts still skips them everywhere we install:
# the flag controls whether scripts RUN, this controls whether pnpm considers the
# question settled.
allowBuilds:
  bufferutil: true
  esbuild: true
  utf-8-validate: true
